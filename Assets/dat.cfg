# Pack config: the .dat packs App builds and mounts (see Packs in Docs/Context/File/CONTEXT.md).
#
#   App.exe --pack-build                 build / update every Pack below (only new and changed files are written)
#   App.exe --pack-build --pack-name X   only Pack X
#   App.exe --packs                      mount every .dat next to App.exe, with the Priority / MountPoint it was built with
#   --pack-config <file>                 another config instead of this one (Assets-relative)
# Without an Assets/ folder (a shipped build), App mounts the .dat files next to it by itself.
#
# Grammar, per Pack block (keys are case-insensitive; list keys take several values and may repeat):
#   Output <path>               the .dat (required), Assets-relative or $(ExeDir)/... = next to the running
#                               executable; its folder is created
#   Source <dir>                the folder packed, default "." (Assets/); pack paths are relative to it
#   Include <prefix> ...        only these folders ("Entities/") or files; none = everything in Source
#   Exclude <prefix> ...        left out (nothing is excluded unless listed here; the pack being written is skipped)
#   IncludeExtension .ext ...   only these extensions; none = every extension
#   ExcludeExtension .ext ...   left out
#   Raw .ext ...                never compressed, on top of .dds .vsc .ktx .ktx2 .png .jpg .jpeg .ogg .mp3 .zip .zst .onnx
#   Compression None|Zstd [lvl] default None; Zstd keeps a file compressed only when it saves MinCompressionGain
#   MinCompressionGain <0..1>   default 0.1
#   Incremental true|false      default true: update in place; false = always a full rewrite
#   CompactThreshold <0..1>     dead fraction of the data that forces a full rewrite, default 0.25
#   Rehash true|false           also hash files whose size + mtime match, default false
#   Threads <n>                 read / hash / compress threads, 0 = all hardware threads
#   Priority <n>                stored in the pack: its mount priority, default 100 (the loose files are 0; higher wins)
#   MountPoint <folder>         stored in the pack: the Assets-relative folder its root appears at, default Assets/
#
# Paths with characters outside the path trie's alphabet (non-ASCII, '\') or of 512+ characters are left out.

# Authored content: everything checked in under Assets/.
Pack Content
	Output $(ExeDir)/Content.dat
	Exclude Local/
	Exclude Models/ Project/ Scenarios/ TerrainDiffusion/ Textures/boat/ Textures/Terrain/
	Exclude imgui.ini
	ExcludeExtension .blend .blend1 .dat .tmp .pdb .ilk
	Compression Zstd 9
	Priority 100

# Generated content: cooked scenes and their textures, SPIR-V, the procedural meshes and textures, and the terrain
# diffusion tile cache (the .tile files: terrain without the ONNX models). Changes often, so it is its own pack, a
# patch over Content.
Pack Generated
	Output $(ExeDir)/Generated.dat
	Include Local/Cooked/ Local/Shaders/ Local/ShaderCache/ Local/Trees/ Local/Rocks/ Local/Clutter/ Local/TerrainTex/
	Include Local/Diffusion/
	ExcludeExtension .dat .tmp .pdb .ilk
	Priority 110
